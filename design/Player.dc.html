<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Bangers&family=Space+Mono:wght@400;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0}
    a{color:#7B4BFF;text-decoration:none}
    a:hover{color:#5A2FE0}

    .screen{
      /* Surfaces invert between themes. Accents do not: a lime sticker is the
         same lime on paper or on ink, which is what keeps the two themes
         recognisably one design rather than a photo negative. */
      --paper:#FBF6EA; --ink:#14110D; --card:#FFFFFF;
      --violet:#7B4BFF; --lime:#CDFF3E; --pink:#FF4D8D; --sky:#54D6F5;
      /* Ink that always sits ON an accent fill, in either theme. */
      --on:#14110D;
      width:390px; height:844px; overflow:hidden; position:relative;
      background:var(--paper); color:var(--ink);
      font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
      display:flex; flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }
    /* Ben-Day dots: the comic half of the brief, kept faint so it reads as paper. */
    .screen::before{
      content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
      background-image:radial-gradient(var(--ink) 1.2px, transparent 1.3px);
      background-size:9px 9px; opacity:.07;
    }
    .screen > *{position:relative; z-index:1}

    /* Dark is a real second skin, not an inversion: the paper goes to a warm
       near-black, the stroke becomes the cream, and every accent stays put. */
    .screen.dark{
      --paper:#17140F; --ink:#F6F0E2; --card:#241F18;
      color:var(--ink);
    }
    .screen.dark::before{opacity:.10}

    .ink{border:3px solid var(--ink)}
    .pop{box-shadow:5px 5px 0 var(--ink)}
    .pop-sm{box-shadow:3px 3px 0 var(--ink)}
    .pop-lg{box-shadow:8px 8px 0 var(--ink)}

    .bang{font-family:"Bangers","Impact","Haettenschweiler",sans-serif;
          letter-spacing:.03em; font-weight:400}
    .mono{font-family:"Space Mono","Courier New",monospace}

    /* Top bar ------------------------------------------------------------ */
    .bar{display:flex; align-items:center; justify-content:space-between;
         gap:12px; padding:52px 20px 14px}
    .word{font-family:"Bangers","Impact",sans-serif; font-size:30px;
          line-height:1; letter-spacing:.04em;
          -webkit-text-stroke:0; color:var(--ink);
          text-shadow:3px 3px 0 var(--violet)}
    .crumb{font-size:11px; font-weight:900; letter-spacing:.16em;
           text-transform:uppercase; opacity:.55}

    /* Buttons ------------------------------------------------------------ */
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      min-height:54px; padding:0 22px; border:3px solid var(--ink);
      border-radius:999px; background:var(--violet); color:#fff;
      font-family:"Archivo",sans-serif; font-weight:900; font-size:15px;
      letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
      box-shadow:5px 5px 0 var(--ink);
      transition:transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s ease;
    }
    /* The signature neobrutalist press: the object moves onto its own shadow. */
    .btn:hover{transform:translate(2px,2px); box-shadow:3px 3px 0 var(--ink)}
    .btn:active{transform:translate(5px,5px); box-shadow:0 0 0 var(--ink)}
    .btn.lime{background:var(--lime); color:var(--on); border-color:var(--on);
              box-shadow:5px 5px 0 var(--on)}
    .btn.lime:hover{box-shadow:3px 3px 0 var(--on)}
    .btn.lime:active{box-shadow:0 0 0 var(--on)}
    .btn.paper{background:var(--card); color:var(--ink)}
    .btn.pink{background:var(--pink); color:var(--on); border-color:var(--on);
              box-shadow:5px 5px 0 var(--on)}
    .btn.pink:hover{box-shadow:3px 3px 0 var(--on)}
    .btn.pink:active{box-shadow:0 0 0 var(--on)}
    .btn.block{width:100%}
    .btn.sm{min-height:40px; font-size:12px; padding:0 14px; box-shadow:3px 3px 0 var(--ink)}
    .btn.sm:hover{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
    .btn.sm.lime, .btn.sm.pink{box-shadow:3px 3px 0 var(--on)}
    .btn.sm.lime:hover, .btn.sm.pink:hover{box-shadow:1px 1px 0 var(--on)}

    /* Cards -------------------------------------------------------------- */
    .card{background:var(--card); border:3px solid var(--ink); border-radius:16px;
          box-shadow:5px 5px 0 var(--ink)}
    .pill{display:inline-flex; align-items:center; gap:6px; height:28px;
          padding:0 11px; border:2.5px solid var(--ink); border-radius:999px;
          background:var(--card); color:var(--ink); font-size:10px; font-weight:900;
          letter-spacing:.12em; text-transform:uppercase}
    .pill.acc{color:var(--on); border-color:var(--on)}

    /* Bottom nav --------------------------------------------------------- */
    .nav{margin-top:auto; display:grid; grid-template-columns:repeat(5,1fr);
         background:var(--card); border-top:3px solid var(--ink);
         padding:10px 6px 22px}
    .nav a{display:flex; flex-direction:column; align-items:center; gap:5px;
           padding:8px 0; color:var(--ink); border-radius:12px;
           transition:transform .15s ease}
    .nav a:hover{transform:translateY(-3px); color:var(--ink)}
    .nav span{font-size:9px; font-weight:900; letter-spacing:.1em;
              text-transform:uppercase}
    /* The active tab is a lime sticker, so it keeps its dark ink in both themes. */
    .nav .sel{background:var(--lime); color:var(--on); border:2.5px solid var(--on);
              box-shadow:3px 3px 0 var(--on)}

    /* Song rows, chips and section headers -------------------------------
       These repeat on Home, Search, Library, Album, Artist, Playlist and the
       queue, so they live with the tokens rather than being redrawn per screen. */
    .sect{display:flex; align-items:baseline; justify-content:space-between;
          gap:10px; margin:20px 0 10px}
    .sect h3{margin:0; font-family:"Bangers","Impact",sans-serif; font-size:22px;
             letter-spacing:.03em; font-weight:400}
    .sect a{font-size:10px; font-weight:900; letter-spacing:.14em;
            text-transform:uppercase; color:var(--ink); opacity:.55}

    .chips{display:flex; gap:8px; overflow:hidden; padding:2px 0 2px}
    .chip{flex:none; height:34px; padding:0 14px; display:inline-flex; align-items:center;
          border:2.5px solid var(--ink); border-radius:999px; background:var(--card);
          color:var(--ink); font-family:"Archivo",sans-serif; font-weight:900; font-size:11px;
          letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
          box-shadow:3px 3px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease}
    .chip:hover{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
    .chip.sel{background:var(--ink); color:var(--paper)}

    /* One track, in a list. The art is a square with the halftone dot screen
       over it, the same treatment the big cover gets, so a 44px thumbnail and a
       full-bleed cover read as the same object. */
    .row{display:flex; align-items:center; gap:12px; padding:9px 0}
    .row .th{flex:none; width:46px; height:46px; border-radius:10px; overflow:hidden;
             position:relative; border:2.5px solid var(--ink)}
    .row .th span{position:absolute; inset:0;
      background-image:radial-gradient(#14110D 1.7px, transparent 1.8px);
      background-size:8px 8px; opacity:.2}
    .row .rm{flex:1; min-width:0}
    .row .rt{font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden;
             text-overflow:ellipsis}
    .row .rs{font-size:11px; font-weight:600; opacity:.6; margin-top:2px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .row .dots{flex:none; width:26px; text-align:center; font-weight:900; opacity:.45;
               letter-spacing:1px; cursor:pointer}
    .row.now .rt{color:var(--violet)}

    /* Search field, shared by the search screen and the library filter. */
    .find{display:flex; align-items:center; gap:10px; height:50px; padding:0 16px;
          background:var(--card); border:3px solid var(--ink); border-radius:999px;
          box-shadow:4px 4px 0 var(--ink)}
    .find input{flex:1; min-width:0; border:0; outline:0; background:transparent;
                color:var(--ink); font-family:"Archivo",sans-serif; font-weight:700;
                font-size:14px}
    .find input::placeholder{color:var(--ink); opacity:.42}

    /* Mini player --------------------------------------------------------
       It sits on the nav rather than floating over the list, because a bar that
       hovers hides the last row of every screen it appears on. */
    .mini-p{margin-top:auto; background:var(--card); border-top:3px solid var(--ink)}
    .mp-bar{height:5px; background:rgba(20,17,13,.14)}
    .mp-bar i{display:block; height:100%; width:34%; background:var(--violet)}
    .screen.dark .mp-bar{background:rgba(246,240,226,.16)}
    .mp-row{display:flex; align-items:center; gap:11px; padding:9px 14px 9px 12px}
    .mp-art{flex:none; width:40px; height:40px; border-radius:9px; border:2.5px solid var(--ink);
            position:relative; overflow:hidden;
            background:linear-gradient(150deg,#7B4BFF,#FF4D8D)}
    .mp-art span{position:absolute; inset:0;
      background-image:radial-gradient(#14110D 1.6px, transparent 1.7px);
      background-size:8px 8px; opacity:.2}
    .mp-meta{flex:1; min-width:0}
    .mp-t{font-size:13px; font-weight:900; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis}
    .mp-a{font-size:10px; font-weight:600; opacity:.6; margin-top:1px;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .mp-b{flex:none; width:38px; height:38px; display:grid; place-items:center;
          border:2.5px solid var(--ink); border-radius:999px; background:var(--card);
          color:var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--ink);
          transition:transform .12s ease, box-shadow .12s ease}
    .mp-b:hover{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
    .mini-p + .nav{margin-top:0; border-top-width:0}

    /* Transport ----------------------------------------------------------
       The round buttons on the player and in the room. */
    .tp{display:flex; align-items:center; justify-content:center; gap:16px}
    .tp button{display:grid; place-items:center; width:56px; height:56px;
               border:3px solid var(--ink); border-radius:999px; background:var(--card);
               color:var(--ink); cursor:pointer; box-shadow:4px 4px 0 var(--ink);
               transition:transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s ease}
    .tp button:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink)}
    .tp button:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
    .tp .big{width:78px; height:78px; background:var(--lime); color:var(--on);
             border-color:var(--on); box-shadow:5px 5px 0 var(--on)}
    .tp .big:hover{box-shadow:3px 3px 0 var(--on)}
    .tp .ghost{width:44px; height:44px; border-width:2.5px; box-shadow:3px 3px 0 var(--ink)}

    /* Motion ------------------------------------------------------------- */
    @keyframes rise{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)}}
    @keyframes popin{0%{opacity:0; transform:scale(.82) rotate(-6deg)}
                     70%{opacity:1; transform:scale(1.05) rotate(1.5deg)}
                     100%{opacity:1; transform:scale(1) rotate(0)}}
    @keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.35)}}
    @keyframes grow{from{width:0}}
    @keyframes drift{0%,100%{transform:rotate(-3deg) translateY(0)}
                     50%{transform:rotate(-3deg) translateY(-5px)}}
    .r{animation:rise .5s cubic-bezier(.2,.8,.25,1) both}
    .p{animation:popin .5s cubic-bezier(.2,.8,.25,1) both}
    .d1{animation-delay:.06s} .d2{animation-delay:.12s} .d3{animation-delay:.18s}
    .d4{animation-delay:.24s} .d5{animation-delay:.30s} .d6{animation-delay:.36s}
    .d7{animation-delay:.42s} .d8{animation-delay:.48s}

    .live{width:10px; height:10px; border-radius:999px; background:var(--pink);
          border:2px solid var(--on); animation:beat 1.4s ease-in-out infinite}

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation:none !important; transition:none !important}
    }
    .screen{background:var(--paper)}
    .pbar{display:flex; align-items:center; gap:12px; padding:48px 20px 10px}
    .ib{flex:none; width:42px; height:42px; display:grid; place-items:center;
        border:3px solid var(--ink); border-radius:999px; background:var(--card);
        color:var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--ink);
        transition:transform .12s ease, box-shadow .12s ease}
    .ib:hover{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
    .from{flex:1; text-align:center; min-width:0}
    .fk{font-size:9px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; opacity:.5}
    .fv{font-size:13px; font-weight:900; margin-top:1px; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis}

    .cover{position:relative; margin:6px 24px 0; aspect-ratio:1; border-radius:22px;
           border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); overflow:hidden;
           background:linear-gradient(158deg,#FF9E2B 0%,#FF4D8D 55%,#7B4BFF 100%)}
    .cover .ht{position:absolute; inset:0;
      background-image:radial-gradient(#14110D 2.2px, transparent 2.3px);
      background-size:11px 11px; opacity:.2; mix-blend-mode:multiply}
    .src{position:absolute; left:14px; top:14px; background:var(--lime); color:var(--on);
         border-color:var(--on); transform:rotate(-4deg)}

    .head{display:flex; align-items:flex-start; gap:12px; padding:20px 24px 0}
    .hm{flex:1; min-width:0}
    .ptitle{margin:0; font-size:27px; line-height:1.06; font-weight:900; letter-spacing:-.03em;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .pby{margin:6px 0 0; font-size:14px; font-weight:700; opacity:.68}
    .heart{flex:none; width:48px; height:48px; display:grid; place-items:center;
           border:3px solid var(--on); border-radius:999px; background:var(--pink);
           color:var(--on); cursor:pointer; box-shadow:4px 4px 0 var(--on)}
    .heart:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--on)}

    .scrub{margin:18px 24px 0}
    .scrub .rail{height:14px; border:3px solid var(--ink); border-radius:999px;
                 background:var(--card); box-shadow:3px 3px 0 var(--ink)}
    .scrub .fill{position:relative; height:100%; width:52%; border-radius:999px;
                 background:var(--violet);
                 background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.32) 0 6px,transparent 6px 13px)}
    .knob{position:absolute; right:-9px; top:50%; transform:translateY(-50%);
          width:20px; height:20px; border-radius:999px; background:var(--lime);
          border:3px solid var(--on); box-shadow:2px 2px 0 var(--on)}
    .clock{display:flex; justify-content:space-between; margin-top:10px; font-size:11px;
           font-weight:700; letter-spacing:.06em; opacity:.75}

    .tp{margin-top:20px}
    .tray{display:flex; justify-content:space-between; gap:8px; margin:20px 22px 0}
    .tb{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
        padding:10px 4px; border:2.5px solid var(--ink); border-radius:14px;
        background:var(--card); color:var(--ink); cursor:pointer;
        font-family:"Archivo",sans-serif; font-weight:900; font-size:9px;
        letter-spacing:.11em; text-transform:uppercase;
        box-shadow:3px 3px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease}
    .tb:hover{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}

    .roomcta{display:flex; align-items:center; justify-content:center; gap:10px;
             margin:16px 22px 26px; min-height:56px; width:calc(100% - 44px);
             border:3px solid var(--on); border-radius:999px; background:var(--lime);
             color:var(--on); font-family:"Archivo",sans-serif; font-weight:900;
             font-size:14px; letter-spacing:.08em; text-transform:uppercase;
             cursor:pointer; box-shadow:5px 5px 0 var(--on);
             transition:transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s ease}
    .roomcta:hover{transform:translate(2px,2px); box-shadow:3px 3px 0 var(--on)}
    .roomcta:active{transform:translate(5px,5px); box-shadow:0 0 0 var(--on)}
  </style>
</helmet>
<div class="screen {{theme}}">
  <div class="pbar">
    <button class="ib" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 9.5 12 15.5 18 9.5"/></svg>
    </button>
    <div class="from">
      <div class="fk">Playing from</div>
      <div class="fv">Blonde</div>
    </div>
    <button class="ib" aria-label="More">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
    </button>
  </div>

  <div class="cover p d1">
    <span class="ht"></span>
    <span class="pill src">Museroom</span>
  </div>

  <div class="head r d2">
    <div class="hm">
      <h1 class="ptitle">Nights</h1>
      <p class="pby">Frank Ocean &middot; Blonde</p>
    </div>
    <button class="heart" aria-label="Like">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M12 20.2 4.6 13a4.6 4.6 0 0 1 7.4-5.3A4.6 4.6 0 0 1 19.4 13z"/></svg>
    </button>
  </div>

  <div class="scrub r d3">
    <div class="rail"><div class="fill"><i class="knob"></i></div></div>
    <div class="clock mono"><span>2:41</span><span>-2:26</span></div>
  </div>

  <div class="tp r d4">
    <button class="ghost" aria-label="Shuffle">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h3.6c3.4 0 3.4 11 6.8 11h4.4M3.5 17.5h3.6c3.4 0 3.4-11 6.8-11h4.4"/><path d="m16.6 3.6 2.9 2.9-2.9 2.9M16.6 14.6l2.9 2.9-2.9 2.9"/></svg>
    </button>
    <button aria-label="Previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18 5.2 8 12l10 6.8z"/><rect x="3.8" y="5" width="3.2" height="14" rx="1.1"/></svg>
    </button>
    <button class="big" aria-label="Pause">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.4" height="16" rx="1.3"/><rect x="13.6" y="4" width="4.4" height="16" rx="1.3"/></svg>
    </button>
    <button aria-label="Next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.2 16 12 6 18.8z"/><rect x="17" y="5" width="3.2" height="14" rx="1.1"/></svg>
    </button>
    <button class="ghost" aria-label="Repeat">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5.5h9a4 4 0 0 1 4 4v1M17 18.5H8a4 4 0 0 1-4-4v-1"/><path d="m9.6 2.9-2.8 2.6 2.8 2.6M14.4 21.1l2.8-2.6-2.8-2.6"/></svg>
    </button>
  </div>

  <div class="tray r d5">
    <button class="tb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6.5h11M4 12h9M4 17.5h13"/><path d="M19 5.5v9.2M19 18.5h.01"/></svg>Lyrics</button>
    <button class="tb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h12M4 12h12M4 18h8"/><path d="m17.5 15 3 3-3 3"/></svg>Queue</button>
    <button class="tb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3.5v9.7"/><path d="M8 7.5 12 3.5l4 4"/><path d="M5 13v6.5h14V13"/></svg>Save</button>
    <button class="tb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 8.5v4.2l2.8 1.6"/><circle cx="12" cy="12.5" r="7.5"/><path d="M9 2.5h6"/></svg>Timer</button>
  </div>

  <!-- Museroom's own button, on the surface where the decision is made rather
       than three taps into a menu: this song, these people, right now. -->
  <button class="roomcta r d6">
    <span class="live"></span>
    <span>Start a room with this</span>
  </button>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
