<div class="screen">
  <div class="bar">
    <span class="crumb">Museroom</span>
    <span class="pill acc" style="background:var(--lime)">2 in range</span>
  </div>

  <div class="body">
    <h2 class="h2 bang p">NEARBY</h2>

    <div class="radar r d2">
      <span class="sweep"></span>
      <i style="width:60px;height:60px"></i>
      <i style="width:118px;height:118px"></i>
      <i style="width:176px;height:176px"></i>
      <span class="blip" style="left:118px;top:56px"></span>
      <span class="blip" style="left:52px;top:120px;animation-delay:.5s"></span>
    </div>

    <div class="toggle r d3">
      <div class="t">
        <b>Broadcasting</b>
        <span>A code that changes every 15 minutes. Not your name.</span>
      </div>
      <span class="sw" role="switch" aria-checked="true" aria-label="Proximity"></span>
    </div>

    <div class="near r d4">
      <span class="cv" style="background:linear-gradient(150deg,#CDFF3E,#7B4BFF)"></span>
      <div class="m">
        <b>@arun_v</b>
        <span>Nights</span>
        <em>Frank Ocean</em>
      </div>
      <button class="btn sm">Listen too</button>
    </div>

    <div class="near r d5">
      <span class="cv" style="background:linear-gradient(150deg,#FF9E2B,#FF4D8D)"></span>
      <div class="m">
        <b>@thebasement</b>
        <span>F o r C e r t a i n</span>
        <em>PARTYNEXTDOOR</em>
      </div>
      <button class="btn sm">Listen too</button>
    </div>
  </div>

<!--NAV-->
</div>
