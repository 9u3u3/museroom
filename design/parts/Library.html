<div class="screen">
  <div class="bar">
    <span class="crumb">Museroom</span>
    <div class="acts">
      <button class="ib" aria-label="Search library">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.1 4.1"/></svg>
      </button>
      <button class="ib" aria-label="New playlist">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div class="body">
    <h2 class="h2 bang p">LIBRARY</h2>

    <div class="chips" style="margin-top:12px">
      <button class="chip sel">Playlists</button>
      <button class="chip">Songs</button>
      <button class="chip">Albums</button>
      <button class="chip">Artists</button>
      <button class="chip">Offline</button>
    </div>

    <div class="sortrow">
      <span class="sort">Recently added &#9662;</span>
      <span class="sort">Grid</span>
    </div>

    <div class="grid">
      <div class="tile p d1">
        <div class="tc liked">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.2 4.6 13a4.6 4.6 0 0 1 7.4-5.3A4.6 4.6 0 0 1 19.4 13z"/></svg>
        </div>
        <div class="tn">Liked songs</div>
        <div class="ts">218 tracks</div>
      </div>
      <div class="tile p d2">
        <div class="tc down">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v10.5"/><path d="m7.5 10 4.5 4 4.5-4"/><path d="M4.5 19.5h15"/></svg>
        </div>
        <div class="tn">Offline</div>
        <div class="ts">64 tracks &middot; 380 MB</div>
      </div>
      <div class="tile p d3">
        <div class="tc" style="background:linear-gradient(150deg,#7B4BFF,#FF4D8D)"><span></span></div>
        <div class="tn">Late drives</div>
        <div class="ts">41 tracks</div>
      </div>
      <div class="tile p d4">
        <div class="tc" style="background:linear-gradient(150deg,#CDFF3E,#54D6F5)"><span></span></div>
        <div class="tn">Study, no words</div>
        <div class="ts">88 tracks</div>
      </div>
      <div class="tile p d5">
        <div class="tc" style="background:linear-gradient(150deg,#54D6F5,#7B4BFF)"><span></span></div>
        <div class="tn">Room favourites</div>
        <div class="ts">Built from likes</div>
      </div>
      <div class="tile p d6">
        <div class="tc" style="background:linear-gradient(150deg,#FF9E2B,#FF4D8D)"><span></span></div>
        <div class="tn">Blonde</div>
        <div class="ts">Frank Ocean</div>
      </div>
    </div>
  </div>

<!--MINI-->
<!--NAV-->
</div>
