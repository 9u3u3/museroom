<div class="screen">
  <div class="bar sbar">
    <button class="ib" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
    </button>
    <div class="find">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" style="opacity:.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.1 4.1"/></svg>
      <input value="frank ocean" aria-label="Search">
      <span class="mono clr">&times;</span>
    </div>
  </div>

  <div class="body">
    <div class="chips">
      <button class="chip sel">Songs</button>
      <button class="chip">Albums</button>
      <button class="chip">Artists</button>
      <button class="chip">Playlists</button>
      <button class="chip">Videos</button>
    </div>

    <!-- The one answer the search is most likely about, given its own card so
         the common case is a single tap and not a scan down a list. -->
    <div class="best p d1">
      <div class="bc" style="background:linear-gradient(150deg,#FF9E2B,#FF4D8D)"><span></span></div>
      <div class="bm">
        <div class="bk">Top result &middot; Artist</div>
        <div class="bt">Frank Ocean</div>
        <div class="bs">4.1M subscribers</div>
      </div>
      <button class="btn sm lime">Play</button>
    </div>

    <div class="sect"><h3>Songs</h3><a href="#">All</a></div>
    <div class="row r d2">
      <div class="th" style="background:linear-gradient(150deg,#FF9E2B,#FF4D8D)"><span></span></div>
      <div class="rm"><div class="rt">Nights</div><div class="rs">Frank Ocean &middot; Blonde &middot; 5:07</div></div>
      <div class="dots">&#8942;</div>
    </div>
    <div class="row r d3">
      <div class="th" style="background:linear-gradient(150deg,#7B4BFF,#FF4D8D)"><span></span></div>
      <div class="rm"><div class="rt">Ivy</div><div class="rs">Frank Ocean &middot; Blonde &middot; 4:09</div></div>
      <div class="dots">&#8942;</div>
    </div>
    <div class="row r d4">
      <div class="th" style="background:linear-gradient(150deg,#54D6F5,#CDFF3E)"><span></span></div>
      <div class="rm"><div class="rt">Pink + White</div><div class="rs">Frank Ocean &middot; Blonde &middot; 3:04</div></div>
      <div class="dots">&#8942;</div>
    </div>

    <div class="sect"><h3>Albums</h3><a href="#">All</a></div>
    <div class="strip">
      <div class="alb r d5"><div class="ac" style="background:linear-gradient(150deg,#FF9E2B,#7B4BFF)"><span></span></div><div class="an">Blonde</div><div class="as">2016</div></div>
      <div class="alb r d6"><div class="ac" style="background:linear-gradient(150deg,#54D6F5,#FF4D8D)"><span></span></div><div class="an">channel ORANGE</div><div class="as">2012</div></div>
      <div class="alb r d7"><div class="ac" style="background:linear-gradient(150deg,#CDFF3E,#7B4BFF)"><span></span></div><div class="an">Endless</div><div class="as">2016</div></div>
    </div>

    <div class="sect"><h3>Recent</h3><a href="#">Clear</a></div>
    <div class="hist">
      <span class="chip">radiohead</span>
      <span class="chip">lofi study</span>
      <span class="chip">arijit singh</span>
    </div>
  </div>

<!--MINI-->
<!--NAV-->
</div>
