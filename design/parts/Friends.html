          <button class="btn sm">Listen too</button>
        </div>

    <div class="fr r d5" style="opacity:.68">

        <div class="song" style="font-weight:600;opacity:.7">Quiet right now</div>

    <div class="search r d6">
      <input placeholder="Find by handle" aria-label="Find by handle">
      <button class="btn sm" style="min-height:48px">Go</button>
